<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#075E54" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UESI Staff Work v1" />
    <link rel="canonical" href="https://uesiap.github.io/apps/uesi/staff-work/v1/gen/itinerary" />
    <link rel="icon" href="https://uesiap.github.io/apps/uesi/staff-work/assets/icons/uesi192.jpg" type="image/png" />
    <link rel="apple-touch-icon" href="https://uesiap.github.io/apps/uesi/staff-work/assets/icons/uesi192.jpg" />
    <title>Generate Itinerary - UESI Staff Work v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/apps/uesi/staff-work/v1/assets/styles/common.css" />
    <link rel="stylesheet" href="/apps/uesi/staff-work/v1/assets/styles/gen.css" />
</head>

<body class="auth-pending" data-kind="itinerary">

    <header class="app-header">
        <button class="icon-btn ripple" id="backBtn" type="button" aria-label="Go back">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="title">Generate Itinerary</span>
    </header>

    <section class="guest-gate needs-guest">
        <div class="gate-icon"><i class="fas fa-lock"></i></div>
        <h1>Login required</h1>
        <p>Login to generate an itinerary.</p>
        <button class="btn btn-primary ripple" id="loginBtn" type="button">
            <i class="fas fa-right-to-bracket"></i> Login to continue
        </button>
    </section>

    <main class="page needs-auth">
        <div class="card">
            <div class="card-title"><i class="fas fa-route"></i> Itinerary details</div>
            <div class="card-sub">These fill the header of the Field Staff Itinerary.</div>

            <form id="reportForm" novalidate autocomplete="off">
                <div class="field">
                    <label class="label" for="staffName">Staff name</label>
                    <input class="input input-readonly" type="text" id="staffName" readonly />
                </div>

                <div class="field">
                    <label class="label" for="staffEmail">Staff email</label>
                    <input class="input input-readonly" type="email" id="staffEmail" readonly />
                </div>

                <div class="field">
                    <label class="label" for="baseInput">Base</label>
                    <input class="input" type="text" id="baseInput"
                           placeholder="e.g. Sainikpuri, MM" autocapitalize="words" />
                </div>

                <div class="field">
                    <label class="label" for="regionInput">Region</label>
                    <input class="input" type="text" id="regionInput"
                           placeholder="e.g. Hyderabad (Central Telangana)" autocapitalize="words" />
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label class="label" for="monthSelect">Month</label>
                        <select class="select" id="monthSelect"></select>
                    </div>
                    <div class="field">
                        <label class="label" for="yearSelect">Year</label>
                        <select class="select" id="yearSelect"></select>
                    </div>
                </div>
            </form>
        </div>

        <button class="btn btn-primary ripple submit-btn" id="generateBtn" type="button">
            <i class="fas fa-file-export"></i> <span>Generate itinerary</span>
        </button>

        <p class="end-note">“Serve the Lord wholeheartedly.” — Eph. 6:7</p>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="/apps/uesi/staff-work/v1/assets/scripts/common.js"></script>
    <script src="/apps/uesi/staff-work/v1/assets/scripts/gen.js"></script>
</body>
</html>
