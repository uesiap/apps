<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#075E54" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UESI Staff Work v1" />
    <link rel="canonical" href="https://uesiap.github.io/apps/uesi/staff-work/v1/settings/kra" />
    <link rel="icon" href="https://uesiap.github.io/apps/uesi/staff-work/assets/icons/uesi192.jpg" type="image/png" />
    <link rel="apple-touch-icon" href="https://uesiap.github.io/apps/uesi/staff-work/assets/icons/uesi192.jpg" />
    <title>KRA Objectives - UESI Staff Work v1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/apps/uesi/staff-work/v1/assets/styles/common.css?v={{ site.github.build_revision }}" />
    <link rel="stylesheet" href="/apps/uesi/staff-work/v1/assets/styles/settings.css?v={{ site.github.build_revision }}" />
</head>

<body class="auth-pending">

    <header class="app-header">
        <button class="icon-btn ripple" id="backBtn" type="button" aria-label="Go back">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="title">KRA Objectives</span>
    </header>

    <!-- Logged-out gate -->
    <section class="guest-gate needs-guest">
        <div class="gate-icon"><i class="fas fa-lock"></i></div>
        <h1>Login required</h1>
        <p>Login to edit your KRA objectives.</p>
        <button class="btn btn-primary ripple" id="loginBtn" type="button">
            <i class="fas fa-right-to-bracket"></i> Login to continue
        </button>
    </section>

    <main class="page needs-auth">
        <div class="card">
            <div class="card-title"><i class="fas fa-bullseye"></i> KRA Objectives</div>
            <div class="card-sub">Set the 5 Key Resulting Area objectives for the year. These appear on every Field Report generated for that year.</div>

            <form id="kraForm" novalidate autocomplete="off">
                <div class="field">
                    <label class="label" for="yearSelect">Year</label>
                    <select class="select" id="yearSelect"></select>
                </div>

                <div class="field">
                    <label class="label" for="kra1">KRA 1</label>
                    <textarea class="textarea" id="kra1" rows="3"
                              placeholder="e.g. Establish EBS cells at ..."></textarea>
                </div>

                <div class="field">
                    <label class="label" for="kra2">KRA 2</label>
                    <textarea class="textarea" id="kra2" rows="3"
                              placeholder="e.g. Strengthen EBS cells at ..."></textarea>
                </div>

                <div class="field">
                    <label class="label" for="kra3">KRA 3</label>
                    <textarea class="textarea" id="kra3" rows="3"></textarea>
                </div>

                <div class="field">
                    <label class="label" for="kra4">KRA 4</label>
                    <textarea class="textarea" id="kra4" rows="3"></textarea>
                </div>

                <div class="field">
                    <label class="label" for="kra5">KRA 5</label>
                    <textarea class="textarea" id="kra5" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary ripple submit-btn">
                    <i class="fas fa-floppy-disk"></i> <span>Save objectives</span>
                </button>
            </form>
        </div>

        <div id="loadState" class="state needs-auth" role="status" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <p>Loading…</p>
        </div>

        <p class="end-note">“Serve the Lord wholeheartedly.” — Eph. 6:7</p>
    </main>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="/apps/uesi/staff-work/v1/assets/scripts/common.js?v={{ site.github.build_revision }}"></script>
    <script src="/apps/uesi/staff-work/v1/assets/scripts/settings-kra.js?v={{ site.github.build_revision }}"></script>
</body>
</html>
