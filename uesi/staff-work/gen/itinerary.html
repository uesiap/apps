<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Keep staff pages out of search results and stop URLs leaking via referrer -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />

    <meta name="theme-color" content="#075E54" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UESI Staff Work" />

    <link rel="icon" href="https://uesiap.github.io/vidhyarthi-geethavali/assets/Icons/uesi192.jpg" type="image/png" />
    <link rel="apple-touch-icon" href="https://uesiap.github.io/vidhyarthi-geethavali/assets/Icons/uesi192.jpg" />

    <title>Generate Itinerary - UESI Staff Work</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="/apps/uesi/staff-work/assets/styles/common.css?v={{ site.github.build_revision }}" />
    <link rel="stylesheet" href="/apps/uesi/staff-work/assets/styles/gen.css?v={{ site.github.build_revision }}" />

    <script src="/apps/uesi/staff-work/assets/scripts/boom.js?v={{ site.github.build_revision }}" defer></script>
</head>

<body class="auth-pending" data-kind="itinerary">

    <header class="app-header">
        <button class="icon-btn ripple" id="backBtn" type="button" aria-label="Go back">
            <i class="fas fa-arrow-left"></i>
        </button>
        <span class="title">Generate Itinerary</span>
    </header>

    <!-- Logged-out gate -->
    <section class="guest-gate needs-guest">
        <div class="gate-icon"><i class="fas fa-lock"></i></div>
        <h1>Login required</h1>
        <p>Login to generate an itinerary.</p>
        <button class="btn btn-primary ripple" id="loginBtn" type="button">
            <i class="fas fa-right-to-bracket"></i> Login to continue
        </button>
    </section>

    <!-- Logged-in content -->
    <main class="page needs-auth">
        <div class="card">
            <div class="card-title"><i class="fas fa-route"></i> Generate Itinerary</div>
            <div class="card-sub">Choose the month and add your details for the report header.</div>

            <form id="reportForm" novalidate autocomplete="off">
                <div class="field">
                    <label class="label" for="staffName">Staff name</label>
                    <input class="input input-readonly" type="text" id="staffName" readonly />
                </div>

                <div class="field">
                    <label class="label" for="staffEmail">Staff email</label>
                    <input class="input input-readonly" type="email" id="staffEmail" readonly />
                </div>

                <div class="field">
                    <label class="label" for="baseInput">Base</label>
                    <input class="input" type="text" id="baseInput" placeholder="e.g. Visakhapatnam" autocapitalize="words" />
                </div>

                <div class="field">
                    <label class="label" for="stateInput">State</label>
                    <input class="input" type="text" id="stateInput" placeholder="e.g. Andhra Pradesh" autocapitalize="words" />
                </div>

                <div class="grid-2">
                    <div class="field">
                        <label class="label" for="monthSelect">Month</label>
                        <select class="select" id="monthSelect"></select>
                    </div>
                    <div class="field">
                        <label class="label" for="yearSelect">Year</label>
                        <select class="select" id="yearSelect"></select>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary ripple submit-btn">
                    <i class="fas fa-file-export"></i> <span>Generate report</span>
                </button>
            </form>
        </div>

        <p class="end-note"> “Serve the Lord wholeheartedly.” - Eph. 6:7</p>
    </main>

    <!-- Shared, then page-specific -->
    <script src="/apps/uesi/staff-work/assets/scripts/common.js?v={{ site.github.build_revision }}"></script>
    <script src="/apps/uesi/staff-work/assets/scripts/gen.js?v={{ site.github.build_revision }}"></script>
</body>
</html>
